name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Lint do frontend
        working-directory: frontend
        run: npm run lint
      - name: Testes da interface
        working-directory: frontend
        run: npm test
      - name: Build do frontend
        working-directory: frontend
        run: npm run build

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: purchase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d purchase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/purchase_test
      MCP_TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/purchase_test
      AGENT_MODE: local
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
    steps:
      - name: Obter código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            mcp-server/requirements.txt
      - name: Testes e avaliação do backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
          python -m evaluation.run
      - name: Testes do servidor MCP
        working-directory: mcp-server
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validar Compose com valores fictícios
        env:
          POSTGRES_PASSWORD: test_password
          PURCHASE_API_DB_PASSWORD: test_api_password
          MCP_DB_PASSWORD: test_mcp_password
          MCP_WRITE_TOKEN: test_token
        run: docker compose --env-file /dev/null config --quiet
      - name: Verificar arquivos sensíveis e padrões de credenciais
        run: python3 scripts/check_secrets.py
